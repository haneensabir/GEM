<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contact-Us</title>
</head>
<body data-theme="light">
<nav>
    <ul>
       <br>
     <li><a href="#"> Login </a></li>
     <li><a href="#"> Sign Up </a></li>
     <li><a href="#"> Halls </a></li>
     <li><a href="#"> Collection </a></li>
     <li><a href="#"> Tickets </a></li>
     <li><a href="#"> About </a></li>
     <li><a href="#"> Contact Us </a></li>
     <li><a href="#"> logout </a></li>
     <!-- <button onclick="toggleTheme()">dark mode</button> -->

     <br><br> 
  </ul>
</nav>
<div class="hero">
    <h1>Timeless Art</h1>
    <p>Where history meets elegance</p>
</div>
<section id="contact" class="fade">
    <h2>Contact Us </h2>
    <div class="container">
        <div class="form">
            <h3>Send Message</h3>
            <form onsubmit="return validateForm()">
                <input type="text" id="name" placeholder="Your Name" >
                <input type="email" id="email" placeholder="Your Email">
                <select>
                    <option>General Inquiry</option>
                    <option>VIP Visit</option>
                    <option>Private Event</option>
                </select>
                <textarea id="message" rows="5" placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
        <div class="info">
            <h3>Visit Us</h3>
            <p>📍 <span>Cairo, Egypt</span></p>
            <p>⏰ <span>9AM - 6PM</span></p>
            <p>📞 <span>+20 123 456 789</span></p>
            <iframe src="https://www.google.com/maps?q=Grand+Egyptian+Museum&output=embed"></iframe>
        </div>


    </div>
</section>
<section id="feedback" class="fade">
    
    <h2>Feedback</h2>
    <div class="feedback-box">
        <div class="stars" id="stars">
      <span data-value="1">★</span>
      <span data-value="2">★</span>
      <span data-value="3">★</span>
      <span data-value="4">★</span>
      <span data-value="5">★</span>
    </div>
        <form onsubmit="return submitFeedback()" >
        <input type="text" id="fname" placeholder="Your Name">
        <textarea id="fmsg" placeholder="Your Feedback"></textarea>
        <button type="submit">Submit Feedback</button>
        </form>
    </div>
    <div id="feedbacklist"></div>


</section>
<footer>
<p>© 2026 Grand Egyptian Museum </p>
</footer>

    <script src="main.js"></script>
</body>
</html>
