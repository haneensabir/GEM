</head>
<body data-theme="light">
<div>
    <header>
    <div class="logo">
        <h1><b> GEM </b></h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html"> Home </a></li>
            <li><a href="hall.html"> Halls </a></li>
            <li><a href="gallery.html"> Collection </a></li>
            <li><a href="tickets.html"> Tickets </a></li>
            <li><a href="about.html"> About </a></li>
            <li><a href="contact.html"> Contact Us </a></li>

   <div class="registration">
      <button class="modebutton"> Mode </button>
      <a id="loginBtn" class="navbutton" href="login.html"> Login </a>
      <a id="signupBtn" class="navbutton" href="signup.html"> Sign Up </a>
      <a id="logoutBtn" class="navbutton" href="#" style="display: none;"> Logout </a>
    </div>
</header>
<div class="hero">
    <h1>Timeless Art</h1>
    <p>Where history meets elegance</p>
</div>
<section id="contact" class="fade">
    <h2>Contact Us </h2>
    <div class="container">
        <div class="form">
            <h3>Send Message</h3>
            <form onsubmit="return validateForm()">
                <input type="text" id="name" placeholder="Your Name" >
                <input type="email" id="email" placeholder="Your Email">
                <select>
                    <option>General Inquiry</option>
                    <option>VIP Visit</option>
                    <option>Private Event</option>
                </select>
                <textarea id="message" rows="5" placeholder="Your Message"></textarea>
                <button class="hh" type="submit">Send Message</button>
            </form>
        </div>
        <div class="info">
            <h3>Visit Us</h3>
            <p>📍 <span>Cairo, Egypt</span></p>
            <p>⏰ <span>9AM - 6PM</span></p>
            <p>📞 <span>+20 123 456 789</span></p>
            <iframe src="https://www.google.com/maps?q=Grand+Egyptian+Museum&output=embed"></iframe>
        </div>


    </div>
</section>
<section id="feedback" class="fade">
    
    <h2>Feedback</h2>
        <form onsubmit="return submitFeedback()" >
        <input type="text" id="fname" placeholder="Your Name">
        <textarea id="fmsg" placeholder="Your Feedback"></textarea>
        <button class="hh" type="submit">Submit Feedback</button>
        </form>
    </div>
    <div id="feedbacklist"></div>


</section>
    <script src="index.js"></script>
    <script src="contact.js"></script>
    
</body>
